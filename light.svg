<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">Vijay HM | Firmware Validation and GenAI Developer</title>
  <desc id="desc">A light terminal-inspired profile banner showing Vijay HM's neon ASCII portrait, firmware validation experience, embedded systems focus, GenAI work, and engineering stack.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".58" stop-color="#f3f8ff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".96"/>
      <stop offset="1" stop-color="#f5f9ff" stop-opacity=".91"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b4fe0"/>
      <stop offset=".55" stop-color="#0788bb"/>
      <stop offset="1" stop-color="#07966d"/>
      <animate attributeName="x1" values="0;-.3;0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#40b8d7" stop-opacity=".16"/>
      <stop offset="1" stop-color="#40b8d7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#5d7899" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="1178" height="608" rx="26"/></clipPath>
    <clipPath id="portraitClip"><ellipse cx="233" cy="291" rx="161" ry="118"/></clipPath>
  </defs>
